                                                  Text(varNPProyectoCreado.ID) &
                                                  "|" &
                                                  Text(c.ID),
                                              Activo:true,
                                              AmbitoSeguridad:varNPProyectoGuid
                                          }
                                      )
                                  );
                          
                                  ForAll(
                                      Filter(
                                          Split(txtNPEntidadesV4.Text,";"),
                                          !IsBlank(Trim(Value))
                                      ) As e,
                                      Patch(
                                          PMS_ProyectoEntidades,
                                          Defaults(PMS_ProyectoEntidades),
                                          {
                                              Título:
                                                  varNPCodigo & " - " & Trim(e.Value),
                                              ProyectoId:varNPProyectoCreado.ID,
                                              Tipo:{Value:"Entidad"},
                                              Nombre:Trim(e.Value),
                                              ClaveRelacion:
                                                  Text(varNPProyectoCreado.ID) &
                                                  "|ENTIDAD|" &
                                                  Upper(Trim(e.Value)),
                                              Activo:true,
                                              AmbitoSeguridad:varNPProyectoGuid
                                          }
                                      )
                                  );
                          
                                  ForAll(
                                      Filter(
                                          Split(txtNPActoresV4.Text,";"),
                                          !IsBlank(Trim(Value))
                                      ) As a,
                                      Patch(
                                          PMS_ProyectoEntidades,
                                          Defaults(PMS_ProyectoEntidades),
                                          {
                                              Título:
                                                  varNPCodigo & " - " & Trim(a.Value),
                                              ProyectoId:varNPProyectoCreado.ID,
                                              Tipo:
                                                  {Value:ddNPTipoActorV4.Selected.Value},
                                              Nombre:Trim(a.Value),
                                              ClaveRelacion:
                                                  Text(varNPProyectoCreado.ID) &
                                                  "|" &
                                                  Upper(ddNPTipoActorV4.Selected.Value) &
                                                  "|" &
                                                  Upper(Trim(a.Value)),
                                              Activo:true,
                                              AmbitoSeguridad:varNPProyectoGuid
                                          }
                                      )
                                  );
                          
                                  );
                                  Set(varNPGuardando,false);
                                  Set(varMostrarNuevoProyecto,false);
                                  Refresh(PMS_Proyectos);
                                  Refresh(PMS_ResumenCartera);
                                  Set(varResumenCarteraActual,LookUp(PMS_ResumenCartera,ClaveResumen=gblClaveResumen));
                          
                                  Notify(
                                      "Proyecto " &
                                      varNPCodigo &
                                      If(varNPEsEdicion," actualizado correctamente"," creado correctamente"),
                                      NotificationType.Success
                                  ),
                          
                                  Set(varNPGuardando,false);
                          
                                  Notify(
                                      "No se pudo crear el proyecto: " &
                                      FirstError.Message,
                                      NotificationType.Error
                                  )
                              )
                          )
                          
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =9
                        Text: =If(varNPGuardando,"Guardando…",If(varNPEsEdicion,"Guardar cambios","Guardar"))
                        Width: =98
                        X: =Parent.Width-122
                        Y: =Parent.Height-52
      - Image1:
