            AccessibleLabel: ="Logotipo de Anglo American"

            TabIndex: =-1

            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =2
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledFill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =4
            Height: =58
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverFill: =RGBA(0, 0, 0, 0)
            Image: ='Anglo-American-Symbol'
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedFill: =RGBA(0, 0, 0, 0)
            Width: =64
      - tmrPMSResumenV5:
          Control: Timer@2.1.0
          Properties:
            AutoStart: =true
            Duration: =30000
            Repeat: =true
            Visible: =false
            OnTimerEnd: |+
              =Refresh(PMS_ResumenCartera);
              Set(gblClaveResumen,"Cartera|" & gblAmbitoResumen & "|" & Text(Today(),"yyyy-mm-dd"));
              Set(varResumenCarteraActual,LookUp(PMS_ResumenCartera,ClaveResumen=gblClaveResumen))
      - conPMAccionOverlayV6:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(15,28,61,0.48)
            Height: =Parent.Height
            Visible: =varMostrarAccionProyecto
            Width: =Parent.Width
          Children:
            - conPMAccionV6:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  Fill: =RGBA(255,255,255,1)
                  DropShadow: =DropShadow.Bold
                  Width: =Min(560,Parent.Width-24)
                  Height: =270
                  X: =(Parent.Width-Self.Width)/2
                  Y: =(Parent.Height-Self.Height)/2
                Children:
                  - lblPMAccionTituloV6:
                      Control: Label@2.5.1
                      Properties:
                        TabIndex: =-1

                        Text: =varPMAccion & " proyecto — " & varPMProyectoAccion.CodigoProyecto
                        Color: =RGBA(6,24,143,1)
                        FontWeight: =FontWeight.Bold
                        X: =20
                        Y: =18
                        Width: =Parent.Width-40
                        Height: =35
                        Size: =15
                  - lblPMAccionDescV6:
                      Control: Label@2.5.1
                      Properties:
                        TabIndex: =-1

                        Text: =If(varPMAccion="Eliminar","Se ocultará de la cartera. El historial se conserva.","Describe el motivo del cambio de estado.")
                        Color: =RGBA(83,98,124,1)
                        X: =20
                        Y: =54
                        Width: =Parent.Width-40
                        Height: =32
                        Size: =10
                  - txtPMMotivoAccionV6:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        FocusedBorderColor: =RGBA(0,120,212,1)

                        FocusedBorderThickness: =2

                        TabIndex: =0

                        AccessibleLabel: ="Ingresar Motivo Accion"

                        Default: =""
                        HintText: ="Motivo / comentario obligatorio"
                        Mode: =TextMode.MultiLine
                        X: =20
                        Y: =93
                        Width: =Parent.Width-40
                        Height: =95
                  - btnPMAccionCancelarV6:
                      Control: Classic/Button@2.2.0
                      Properties:
                        FocusedBorderColor: =RGBA(0,120,212,1)

                        FocusedBorderThickness: =2

                        TabIndex: =0

                        Text: ="Cancelar"
                        X: =Parent.Width-235
                        Y: =211
                        Width: =96
                        Height: =36
                        OnSelect: =Set(varMostrarAccionProyecto,false)
                  - btnPMAccionConfirmarV6:
                      Control: Classic/Button@2.2.0
                      Properties:
                        FocusedBorderColor: =RGBA(0,120,212,1)

                        FocusedBorderThickness: =2

                        TabIndex: =0

                        Text: =If(varPMAccion="Eliminar","Eliminar","Confirmar")
                        X: =Parent.Width-126
                        Y: =211
                        Width: =106
                        Height: =36
                        Fill: =If(varPMAccion="Eliminar",RGBA(201,45,56,1),RGBA(6,24,143,1))
                        DisplayMode: =If(gblEsAdmin || (gblEsSupervisor && varPMProyectoAccion.SupervisorCorreo=gblCorreo),DisplayMode.Edit,DisplayMode.Disabled)
                        OnSelect: |+
                          =If(IsBlank(Trim(txtPMMotivoAccionV6.Text)),
                              Notify("Escribe el motivo",NotificationType.Error),
                              !(gblEsAdmin || (gblEsSupervisor && varPMProyectoAccion.SupervisorCorreo=gblCorreo)),
                              Notify("Sin permiso",NotificationType.Error),
                              IfError(
                                  Switch(varPMAccion,
                                      "Paralizar",Patch(PMS_Proyectos,varPMProyectoAccion,
                                          {EstadoProyecto:{Value:"Paralizado"},FechaParalizacion:Today(),MotivoParalizacion:Trim(txtPMMotivoAccionV6.Text)}),
                                      "Terminar",Patch(PMS_Proyectos,varPMProyectoAccion,
                                          {EstadoProyecto:{Value:"Terminado"},FechaFinalizacion:Today(),FeedbackCierre:Trim(txtPMMotivoAccionV6.Text)}),
                                      "Reactivar",Patch(PMS_Proyectos,varPMProyectoAccion,
                                          {EstadoProyecto:{Value:"En proceso"},ComentarioModificacion:Trim(txtPMMotivoAccionV6.Text)}),
                                      "Eliminar",Patch(PMS_Proyectos,varPMProyectoAccion,
                                          {Activo:false,ComentarioModificacion:Trim(txtPMMotivoAccionV6.Text)})
                                  );
                                  Refresh(PMS_Proyectos);
                                  Set(varMostrarAccionProyecto,false);
                                  Notify("Proyecto actualizado",NotificationType.Success),
                                  Notify("No se guardó el cambio: " & FirstError.Message,NotificationType.Error)))
