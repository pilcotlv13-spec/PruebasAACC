Screens:
  scrPrincipal:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |+
        =Refresh(PMS_Usuarios);
        ClearCollect(colNPSupervisores,AddColumns(Filter(PMS_Usuarios,Activo=true,RolGlobal.Value="Supervisor"),NombreVisible,Coalesce(Usuario.DisplayName,Título)));
        Set(gblCorreo,Lower(Trim(User().Email)));
        Set(gblPerfil,LookUp(PMS_Usuarios,CorreoNormalizado=gblCorreo));
        If(IsBlank(gblPerfil.ID),Set(gblPerfil,LookUp(PMS_Usuarios,Usuario.Email=gblCorreo)));
        Set(gblEsAdmin,!IsBlank(gblPerfil.ID) && gblPerfil.Activo=true && gblPerfil.RolGlobal.Value="Administrador");
        Set(gblEsSupervisor,!IsBlank(gblPerfil.ID) && gblPerfil.Activo=true && gblPerfil.RolGlobal.Value="Supervisor");
        Set(gblPuedeCrearProyecto,Coalesce(gblPerfil.PuedeCrearProyecto,false));
        Set(gblAmbitoResumen,If(gblEsAdmin,"GLOBAL",gblCorreo));
        Set(gblClaveResumen,"Cartera|" & gblAmbitoResumen & "|" & Text(Today(),"yyyy-mm-dd"));
        Set(varResumenPrograma,false);
        Set(varPMSResetFiltros,false);
        Set(varNPTab,"General");
        Set(varNPSelector,"");
        Set(varMostrarNuevoProyecto,false);
        Set(varNPEsEdicion,false);
        Set(varMostrarAccionProyecto,false);
        Set(varNPGuardando,false);
        Set(varResumenCarteraActual,LookUp(PMS_ResumenCartera,ClaveResumen=gblClaveResumen))
    Children:
      - conPMSPrincipalV3:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(245,247,252,1)
            Height: =Parent.Height
            Width: =Parent.Width
