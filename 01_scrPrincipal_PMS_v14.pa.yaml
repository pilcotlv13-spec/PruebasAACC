                  - btnNuevoProyecto:
                      Control: Classic/Button@2.2.0
                      Properties:
                        FocusedBorderColor: =RGBA(0,120,212,1)

                        FocusedBorderThickness: =2

                        TabIndex: =0

                        DisplayMode: |+
                          =If(Coalesce(
                              LookUp(PMS_Usuarios,CorreoNormalizado=Lower(Trim(User().Email)),PuedeCrearProyecto),
                              LookUp(PMS_Usuarios,Usuario.Email=User().Email,PuedeCrearProyecto),
                              false),DisplayMode.Edit,DisplayMode.Disabled)

                        Visible: =true
                        BorderThickness: =0
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =RGBA(6, 24, 143, 1)
                        Height: =38
                        OnSelect: |+
                          =ClearCollect(colNPFISSeleccionadas,Filter(PMS_FIS,ID=0)); ClearCollect(colNPCompromisosSeleccionados,Filter(PMS_Compromisos,ID=0)); Set(varNPSelector,""); Refresh(PMS_Usuarios); ClearCollect(colNPSupervisores,AddColumns(Filter(PMS_Usuarios,Activo=true,RolGlobal.Value="Supervisor"),NombreVisible,Coalesce(Usuario.DisplayName,Título))); Set(gblCorreo,Lower(Trim(User().Email)));
                          Set(gblPerfil,LookUp(PMS_Usuarios,CorreoNormalizado=gblCorreo));
                          If(IsBlank(gblPerfil.ID),Set(gblPerfil,LookUp(PMS_Usuarios,Usuario.Email=gblCorreo)));
                          Set(gblPuedeCrearProyecto,Coalesce(
                              LookUp(PMS_Usuarios,CorreoNormalizado=gblCorreo,PuedeCrearProyecto),
                              LookUp(PMS_Usuarios,Usuario.Email=gblCorreo,PuedeCrearProyecto),false));
                          If(gblPuedeCrearProyecto,
                              Set(varNPEsEdicion,false);
                              Set(varNPProyectoEditar,Blank());
                              Set(varNPTab,"General");
                              Set(varNPProyectoGuid,Text(GUID()));
                              Set(varNPReset,true); Set(varNPReset,false);
                              Set(varMostrarNuevoProyecto,true),
                              Notify("Marca PuedeCrearProyecto = Sí en tu registro de PMS_Usuarios y comprueba el correo",NotificationType.Error))
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =9
                        Text: ="+ Nuevo proyecto"
                        Width: =154
                        X: =Parent.Width-202
                        Y: =84
