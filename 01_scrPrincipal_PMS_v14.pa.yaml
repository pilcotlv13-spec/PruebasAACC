                              Set(varNPTab,"General");
                              Notify("Ingresa un presupuesto válido",NotificationType.Error),
                          
                              IsBlank(ddNPRazonSocialV4.Selected.Codigo) ||
                              IsBlank(ddNPOrigenInversionV4.Selected.Codigo) ||
                              IsBlank(ddNPTipoEjecucionV4.Selected.Codigo) ||
                              IsBlank(ddNPRubroDACV4.Selected.Codigo) ||
                              IsBlank(ddNPElementoSEDV4.Selected.ID) ||
                              IsBlank(ddNPTipoReceptorV4.Selected.Codigo),
