                              IsBlank(cmbNPSupervisorV4.Selected.Alias),
                              Notify("Completa Alias del supervisor en PMS_Usuarios",NotificationType.Error),
                          
                              IsBlank(Trim(txtNPNombreV4.Text)),
                              Set(varNPTab,"General");
                              Notify("Completa el nombre del proyecto",NotificationType.Error),
                          
                              IsBlank(Trim(txtNPDescripcionV4.Text)),
                              Set(varNPTab,"General");
                              Notify("Completa la descripción",NotificationType.Error),
                          
                              IsBlank(ddNPTipoActividadV4.Selected.Codigo) ||
                              IsBlank(ddNPSubtipoActividadV4.Selected.Codigo),
